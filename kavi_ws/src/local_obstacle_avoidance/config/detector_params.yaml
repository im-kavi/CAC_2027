from setuptools import find_packages, setup
import os
from glob import glob

package_name = 'local_obstacle_avoidance'

setup(
    name=package_name,
    version='0.1.0',
    packages=find_packages(exclude=['test']),
    data_files=[
        ('share/ament_index/resource_index/packages',
            ['resource/' + package_name]),
        ('share/' + package_name, ['package.xml']),
        (os.path.join('share', package_name, 'launch'), glob('launch/*.launch.py')),
        (os.path.join('share', package_name, 'config'), glob('config/*.yaml')),
        (os.path.join('share', package_name, 'models'), glob('models/*.*')),
        (os.path.join('share', package_name, 'rviz'), glob('rviz/*.rviz')),
    ],
    install_requires=['setuptools'],
    zip_safe=True,
    maintainer='kavi',
    maintainer_email='kavi@todo.todo',
    description='Local obstacle detection and avoidance using YOLO segmentation (best.pt)',
    license='Apache-2.0',
    tests_require=['pytest'],
    entry_points={
        'console_scripts': [
            'yolo_obstacle_detector = local_obstacle_avoidance.yolo_obstacle_detector:main',
            'reactive_avoidance_node = local_obstacle_avoidance.reactive_avoidance_node:main',
        ],
    },
)
